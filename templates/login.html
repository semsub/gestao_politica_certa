<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Júnior Araújo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; }

        .bg-login {
            /* ATUALIZADO: Busca o fundo_login do banco de dados */
            background: url('/static/uploads/{{ config.fundo_login if config and config.fundo_login else "default_bg.jpg" }}') no-repeat center center fixed;
            background-size: cover;
            height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .bg-login::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); z-index: 1;
        }

        .login-card {
            position: relative; z-index: 2;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px 30px;
            width: 90%; max-width: 380px;
            text-align: center; color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .logo-login {
            width: 110px; height: 110px; object-fit: cover;
            background: white; border-radius: 50%; padding: 5px;
            margin-bottom: 20px; border: 3px solid #D4AF37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px; height: 50px; border: none;
        }

        .btn-ouro {
            background: linear-gradient(45deg, #B8860B, #D4AF37);
            border: none; border-radius: 12px; height: 50px;
            width: 100%; font-weight: bold; color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .btn-ouro:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <div class="bg-login">
        <div class="login-card">
            <img src="/static/uploads/{{ config.foto_perfil if config and config.foto_perfil else 'logo_default.png' }}" class="logo-login">
            
            <h3 class="fw-bold mb-1">ACESSO</h3>
            <p class="small mb-4 text-white-50">Júnior Araújo Sistemas</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-danger py-2 small border-0 rounded-3 mb-3" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <input type="text" name="login" class="form-control mb-3 text-center" placeholder="Seu Usuário" required>
                <input type="password" name="senha" class="form-control mb-4 text-center" placeholder="Sua Senha" required>
                <button type="submit" class="btn btn-ouro text-uppercase">Entrar no Sistema</button>
            </form>
            
            <p class="mt-4 mb-0" style="font-size: 0.7rem; color: rgba(255,255,255,0.4);">
                &copy; 2024 Gestão Política Inteligente
            </p>
        </div>
    </div>
</body>
</html>
