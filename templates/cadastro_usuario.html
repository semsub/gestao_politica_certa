{% extends 'base.html' %}
{% block content %}
<div class="container-fluid mt-2">
    <div class="card card-luxo p-4 shadow animate__animated animate__fadeIn" style="border-radius: 20px; border: none;">
        <h4 class="fw-bold gold-text text-uppercase mb-4">
            <i class="bi bi-person-plus-fill me-2"></i>Cadastrar Membro
        </h4>

        <form action="{{ url_for('cadastro_usuario') }}" method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-secondary">NOME COMPLETO</label>
                    <input type="text" name="nome" class="form-control rounded-pill border-warning" placeholder="Ex: João Silva" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-secondary">NÍVEL DE ACESSO</label>
                    <select name="nivel" id="nivel_select" class="form-select rounded-pill border-warning" required onchange="ajustarCampos()">
                        <option value="" selected disabled>Selecione...</option>
                        {% if user.nivel == 'ADM' %}
                        <option value="CANDIDATO">CANDIDATO</option>
                        <option value="COORDENADOR">COORDENADOR</option>
                        <option value="LIDERANÇA">LIDERANÇA</option>
                        {% else %}
                        <option value="COORDENADOR">COORDENADOR</option>
                        <option value="LIDERANÇA">LIDERANÇA</option>
                        {% endif %}
                    </select>
                </div>

                <div class="col-md-6" id="div_cargo" style="display: none;">
                    <label class="form-label small fw-bold text-secondary">CARGO DISPUTADO</label>
                    <select name="cargo" id="cargo_select" class="form-select rounded-pill border-warning" onchange="ajustarCampos()">
                        <optgroup label="Cargos Municipais">
                            <option value="VEREADOR">VEREADOR</option>
                            <option value="PREFEITO">PREFEITO</option>
                        </optgroup>
                        <optgroup label="Cargos Estaduais/Federais">
                            <option value="DEPUTADO ESTADUAL">DEPUTADO ESTADUAL</option>
                            <option value="DEPUTADO FEDERAL">DEPUTADO FEDERAL</option>
                            <option value="GOVERNADOR">GOVERNADOR</option>
                            <option value="SENADOR">SENADOR</option>
                        </optgroup>
                    </select>
                </div>

                <div class="col-md-6" id="div_municipio">
                    <label class="form-label small fw-bold text-secondary">MUNICÍPIO / BASE</label>
                    <select name="municipio" id="municipio_select" class="form-select rounded-pill border-warning">
                        <option value="">Selecione a cidade do Pará...</option>
                        {% for m in municipios %}
                        <option value="{{ m }}">{{ m }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-secondary">LOGIN DE ACESSO</label>
                    <input type="text" name="login" class="form-control rounded-pill border-warning" placeholder="usuario.nome" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-secondary">SENHA</label>
                    <input type="text" name="senha" class="form-control rounded-pill border-warning" placeholder="Crie uma senha" required>
                </div>
            </div>

            <div class="mt-4 pb-3">
                <button type="submit" class="btn btn-ouro w-100 py-3 text-uppercase shadow fw-bold">
                    <i class="bi bi-check-circle me-2"></i>Finalizar Cadastro de Equipe
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function ajustarCampos() {
    const nivel = document.getElementById('nivel_select').value;
    const cargo = document.getElementById('cargo_select').value;
    const divCargo = document.getElementById('div_cargo');
    const divMunicipio = document.getElementById('div_municipio');
    const municipioSelect = document.getElementById('municipio_select');

    // Lista de cargos Estaduais/Federais que não precisam de município fixo
    const cargosEstaduaisFederais = [
        'DEPUTADO ESTADUAL',
        'DEPUTADO FEDERAL',
        'GOVERNADOR',
        'SENADOR'
    ];

    // 1. Mostrar/Esconder campo de Cargo
    if (nivel === 'CANDIDATO') {
        divCargo.style.display = 'block';
    } else {
        divCargo.style.display = 'none';
        divCargo.querySelector('select').value = "";
    }

    // 2. Lógica do Município (Regras do Júnior):
    // - Candidato Estadual/Federal: OCULTA municípios.
    // - Candidato Municipal: MOSTRA municípios.
    // - Liderança/Coordenador: SEMPRE MOSTRA para saber a origem.
    
    if (nivel === 'CANDIDATO' && cargosEstaduaisFederais.includes(cargo)) {
        divMunicipio.style.display = 'none';
        municipioSelect.removeAttribute('required');
        municipioSelect.value = ""; 
    } else {
        divMunicipio.style.display = 'block';
        municipioSelect.setAttribute('required', 'required');
    }
}

// Inicializa a lógica ao carregar
document.addEventListener('DOMContentLoaded', ajustarCampos);
</script>

<style>
    .gold-text { color: #D4AF37; }
    .btn-ouro { background: linear-gradient(45deg, #B8860B, #D4AF37); color: white; border: none; }
    .form-control:focus, .form-select:focus { 
        box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
        border-color: #D4AF37;
    }
</style>
{% endblock %}
