<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO DE APOIADOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #050b1a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container-main {
            max-width: 900px;
            margin: 40px auto;
            border: 2px solid #D4AF37;
            border-radius: 15px;
            padding: 30px;
            background-color: #0a192f;
        }
        .header-title {
            color: #D4AF37;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .lideranca-info {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .lideranca-nome { font-weight: bold; }
        
        .form-label {
            font-weight: 500;
            color: #f8f9fa;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .form-control, .form-select {
            background-color: white;
            border-radius: 5px;
            border: none;
            margin-bottom: 15px;
            height: 45px;
        }
        .btn-confirmar {
            background-color: #D4AF37;
            color: black;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-confirmar:hover {
            background-color: #bfa030;
            transform: scale(1.01);
        }
        .row-compact { margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="container-main shadow-lg">
        <h2 class="header-title">CADASTRO DE APOIADOR</h2>
        <div class="lideranca-info">
            Liderança Responsável: <span class="lideranca-nome">{{ lideranca }}</span>
        </div>

        <form action="{{ url_for('novo_eleitor') }}" method="POST">
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" name="nome_completo" class="form-control" required>
            </div>

            <div class="row row-compact">
                <div class="col-md-6">
                    <label class="form-label">Título Eleitoral</label>
                    <input type="text" name="titulo_eleitoral" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Zona</label>
                    <input type="text" name="zona" class="form-control" placeholder="Zona">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Seção</label>
                    <input type="text" name="secao" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Rua</label>
                <input type="text" name="rua" class="form-control">
            </div>

            <div class="row row-compact">
                <div class="col-md-4">
                    <label class="form-label">Número</label>
                    <input type="text" name="numero" class="form-control">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Bairro</label>
                    <input type="text" name="bairro" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Município</label>
                <select name="municipio" class="form-select" required>
                    <option value="" disabled selected>Selecione o Município</option>
                    {% for m in municipios %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-confirmar">CONFIRMAR APOIO</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
