{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card-luxo p-4 shadow mb-5">
        <div class="text-center mb-4">
            <h2 class="gold-text fw-bold">CADASTRO DE APOIADOR</h2>
            <p class="text-secondary">Você está sendo indicado por: <br>
               <span class="badge bg-dark text-gold fs-6 p-2 mt-2">{{ lideranca }}</span>
            </p>
        </div>

        <form method="POST" action="{{ url_for('novo_eleitor') }}">
            <input type="hidden" name="lider_id" value="{{ lider_id }}">

            <div class="mb-3">
                <label class="small fw-bold text-secondary">NOME COMPLETO</label>
                <input type="text" name="nome_completo" class="form-control rounded-pill" required>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="small fw-bold text-secondary">TÍTULO ELEITORAL</label>
                    <input type="text" name="titulo_eleitoral" class="form-control rounded-pill" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="small fw-bold text-secondary">ZONA</label>
                    <input type="text" name="zona" class="form-control rounded-pill" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="small fw-bold text-secondary">SEÇÃO</label>
                    <input type="text" name="secao" class="form-control rounded-pill" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="small fw-bold text-secondary">MUNICÍPIO ONDE VOTA</label>
                <select name="municipio" class="form-select rounded-pill" required>
                    <option value="">Selecione...</option>
                    {% for m in municipios %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="small fw-bold text-secondary">BAIRRO</label>
                <input type="text" name="bairro" class="form-control rounded-pill">
            </div>

            <button type="submit" class="btn btn-ouro w-100 py-3 shadow mt-3">
                <i class="bi bi-check-lg me-2"></i>CONFIRMAR MEU APOIO
            </button>
        </form>
    </div>
</div>
{% endblock %}
