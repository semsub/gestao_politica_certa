{% extends "base.html" %}
{% block content %}
<h2>Dashboard com Mapa</h2>

<div id="map" style="height:500px;width:100%;margin-bottom:20px;"></div>

<script>
    // Exemplo básico de mapa com Leaflet
    var map = L.map('map').setView([-1.455, -48.503], 6); // Pará central

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18
    }).addTo(map);

    {% for municipio in municipios %}
    L.marker([{{ municipio.lat }}, {{ municipio.lng }}])
        .addTo(map)
        .bindPopup("{{ municipio.nome }} - {{ municipio.total_votos }} votos");
    {% endfor %}
</script>
{% endblock %}
