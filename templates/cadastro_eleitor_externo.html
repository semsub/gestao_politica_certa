<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Apoio - JÚNIOR ARAÚJO SISTEMAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --ouro: #D4AF37; --dark: #0A192F; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        
        /* Botão de compartilhamento no topo fixo ou inicial */
        .btn-share-topo {
            background: #25d366;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-bottom: 3px solid #128c7e;
        }

        .header-externo { 
            background: var(--dark); 
            color: white; 
            padding: 30px 20px; 
            text-align: center; 
            border-bottom: 5px solid var(--ouro);
        }

        .card-cadastro {
            margin-top: -20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            border: none;
        }

        .form-label { font-weight: 700; color: var(--dark); font-size: 0.8rem; text-transform: uppercase; }
        .form-control, .form-select { border-radius: 8px; padding: 10px; background-color: #f8f9fa; border: 1px solid #ddd; }

        .btn-enviar {
            background: linear-gradient(45deg, #B8860B, #D4AF37);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <a href="javascript:void(0);" onclick="compartilharAgora()" class="btn-share-topo">
        <i class="bi bi-whatsapp me-2 fs-4"></i> AJUDE A DIVULGAR: COMPARTILHAR VIA WHATSAPP
    </a>

    <div class="header-externo">
        <h3 class="fw-bold mb-1">UNIDOS POR SALINAS</h3>
        <p class="mb-0 opacity-75 small">Rede de Cuidado e Gestão Solidária</p>
        
        {% if user %}
        <div style="margin-top: 10px; font-size: 0.8rem; color: var(--ouro);">
            <i class="bi bi-person-check-fill me-1"></i> Você está se cadastrando com: <strong>{{ user.nome }}</strong>
        </div>
        {% endif %}
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card-cadastro">
                    <p class="text-center text-muted small mb-4">
                        Preencha seus dados para fazer parte da nossa rede de apoio e benefícios em Salinas.
                    </p>

                    <form action="{{ url_for('novo_eleitor') }}" method="POST">
                        <input type="hidden" name="lider_id" value="{{ user.id if user else 1 }}">

                        <div class="mb-3">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" name="nome_completo" class="form-control" required>
                        </div>

                        <div class="row">
                            <div class="col-12 mb-3">
                                <label class="form-label">Título Eleitoral (Opcional)</label>
                                <input type="text" name="titulo_eleitoral" class="form-control">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Zona</label>
                                <input type="text" name="zona" class="form-control">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Seção</label>
                                <input type="text" name="secao" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Município</label>
                            <select name="municipio" class="form-select">
                                <option value="Salinópolis" selected>Salinópolis</option>
                                {% for m in municipios %}
                                <option value="{{ m }}">{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Bairro</label>
                            <input type="text" name="bairro" class="form-control" required>
                        </div>

                        <div class="row">
                            <div class="col-8 mb-3">
                                <label class="form-label">Rua</label>
                                <input type="text" name="rua" class="form-control">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label">Nº</label>
                                <input type="text" name="numero" class="form-control">
                            </div>
                        </div>

                        <button type="submit" class="btn-enviar shadow">
                            FINALIZAR MEU CADASTRO
                        </button>
                    </form>
                </div>

                <div class="text-center mt-4 opacity-50">
                    <small>Desenvolvido por <strong>JÚNIOR ARAÚJO SISTEMAS</strong></small>
                </div>
            </div>
        </div>
    </div>

    <script>
    function compartilharAgora() {
        // Link atual da página (com o ID do líder)
        const linkAtual = window.location.href;
        
        const texto = `Juntos somos mais fortes por Salinas! 🤝

Amigos e amigas, vocês sabem que meu compromisso com a nossa gente não é de hoje. 
Seja nas ações de cidadania, no Dia das Crianças, no nosso Natal Solidário ou no 
suporte diário com consultas e cirurgias, meu foco sempre foi cuidar de quem mais precisa.

Mas para que eu possa fazer ainda mais e trazer projetos maiores para Salinas e região, 
precisamos de organização. Criamos um novo Sistema de Gestão Política para cadastrar todos os nossos amigos e parceiros.

Por que se cadastrar?
- Para que eu tenha força política para cobrar melhorias junto ao governo.
- Para facilitar o acesso a programas como o Cheque Moradia.
- Atenção: Se surgirem novos benefícios e programas sociais, só conseguirei priorizar e ajudar quem estiver devidamente cadastrado no sistema.

Não fique de fora! Clique no link abaixo e garanta que você e sua família façam parte dessa rede de cuidado:

${linkAtual}`;

        const encodedText = encodeURIComponent(texto);
        window.open(`https://api.whatsapp.com/send?text=${encodedText}`, '_blank');
    }
    </script>
</body>
</html>
