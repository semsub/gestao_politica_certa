<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Eleitor - {{ lider.nome }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0A192F; color: white; }
        .card-luxo { background: rgba(255,255,255,0.1); border-radius: 15px; border: 1px solid #D4AF37; }
        .btn-ouro { background: linear-gradient(45deg, #B8860B, #D4AF37); border: none; color: black; font-weight: bold; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card-luxo p-4 shadow">
        <h2 class="text-center" style="color:#D4AF37;">CADASTRO DE APOIADOR</h2>
        <p class="text-center mb-4">Liderança Responsável: <strong>{{ lider.nome }}</strong></p>
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" name="nome_completo" class="form-control" required>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label">Título Eleitoral</label>
                    <input type="text" name="titulo_eleitoral" class="form-control" required>
                </div>
                <div class="col-3 mb-3">
                    <label class="form-label">Zona</label>
                    <input type="text" name="zona" class="form-control" required>
                </div>
                <div class="col-3 mb-3">
                    <label class="form-label">Seção</label>
                    <input type="text" name="secao" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Rua</label>
                <input type="text" name="rua" class="form-control">
            </div>
            <div class="row">
                <div class="col-4 mb-3">
                    <label class="form-label">Número</label>
                    <input type="text" name="numero" class="form-control">
                </div>
                <div class="col-8 mb-3">
                    <label class="form-label">Bairro</label>
                    <input type="text" name="bairro" class="form-control">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Município</label>
                <input type="text" class="form-control" value="{{ lider.municipio }}" readonly>
            </div>
            <button type="submit" class="btn btn-ouro w-100 py-3">CONFIRMAR APOIO</button>
        </form>
    </div>
</div>
</body>
</html>
