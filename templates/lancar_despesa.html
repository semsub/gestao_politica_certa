{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card-luxo p-4 shadow">
        <h2 class="gold-text fw-bold mb-4"><i class="bi bi-cash-stack me-2"></i>Lançar Nova Despesa</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="small fw-bold text-secondary">VALOR (R$)</label>
                <input type="number" step="0.01" name="valor" class="form-control rounded-pill border-gold" placeholder="0,00" required>
            </div>
            
            <div class="mb-3">
                <label class="small fw-bold text-secondary">DESCRIÇÃO DA DESPESA</label>
                <input type="text" name="descricao" class="form-control rounded-pill" placeholder="Ex: Combustível, Aluguel..." required>
            </div>

            <div class="mb-3">
                <label class="small fw-bold text-secondary">BENEFICIÁRIO / DESTINO</label>
                <input list="lista_beneficiarios" name="beneficiario" class="form-control rounded-pill" placeholder="Selecione ou digite o nome..." required>
                <datalist id="lista_beneficiarios">
                    {% for b in beneficiarios %}
                    <option value="{{ b }}">
                    {% endfor %}
                </datalist>
                <small class="text-muted">Selecione um membro da equipe ou eleitor da lista.</small>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-ouro flex-grow-1 py-2 shadow">
                    <i class="bi bi-check-circle me-1"></i> SALVAR DESPESA
                </button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-dark py-2 px-4 shadow">VOLTAR</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
