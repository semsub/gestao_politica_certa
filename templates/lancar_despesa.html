{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Lançar Nova Despesa</h2>
    <form method="POST">
        <div class="mb-3">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" name="valor" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Descrição da Despesa</label>
            <input type="text" name="descricao" class="form-control" placeholder="Ex: Combustível, Aluguel..." required>
        </div>
        <button type="submit" class="btn btn-success">Salvar Despesa</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
