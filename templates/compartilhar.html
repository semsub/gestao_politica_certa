{% extends 'base.html' %}
{% block content %}
<div class="container text-center py-5 animate__animated animate__fadeIn">
    <div class="card-luxo p-5 d-inline-block shadow-lg" style="max-width: 500px;">
        <i class="bi bi-qr-code-scan gold-text display-1"></i>
        <h2 class="fw-bold mt-4">Expanda sua Base</h2>
        <p class="text-muted">Gere seu link exclusivo e envie para novos eleitores se cadastrarem na sua rede.</p>
        
        <div class="input-group mb-4 shadow-sm">
            <input type="text" value="{{ link }}" id="meuLink" class="form-control border-0 bg-light p-3" readonly>
            <button class="btn btn-dark px-4" onclick="copy()">Copiar</button>
        </div>

        <div class="d-grid gap-2">
            <a href="https://wa.me/?text=Juntos somos mais fortes por Salinas! 🤝

Amigos e amigas, vocês sabem que meu compromisso com a nossa gente não é de hoje. Seja nas ações de cidadania, no Dia das Crianças, no nosso Natal Solidário ou no suporte diário com consultas e cirurgias, meu foco sempre foi cuidar de quem mais precisa.

Mas para que eu possa fazer ainda mais e trazer projetos maiores para Salinas e região, precisamos de organização. Criamos um novo Sistema de Gestão Política para cadastrar todos os nossos amigos e parceiros.

Por que se cadastrar?
- Para que eu tenha força política para cobrar melhorias junto ao governo.
- Para facilitar o acesso a programas como o Cheque Moradia.
- Atenção: Se surgirem novos benefícios e programas sociais, só conseguirei priorizar e ajudar quem estiver devidamente cadastrado no sistema.

Não fique de fora! Clique no link abaixo e garanta que você e sua família façam parte dessa rede de cuidado.: {{ link }}" 
               target="_blank" class="btn btn-success py-3 rounded-pill fw-bold">
               <i class="bi bi-whatsapp me-2"></i> ENVIAR NO WHATSAPP
            </a>
        </div>
    </div>
</div>

<script>
function copy() {
    var copyText = document.getElementById("meuLink");
    copyText.select();
    navigator.clipboard.writeText(copyText.value);
    alert("Link Copiado!");
}
</script>
{% endblock %}
