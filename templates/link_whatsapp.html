{% extends 'base.html' %}
{% block content %}
<div class="card-luxo p-4 text-center">
    <div class="mb-4">
        <i class="bi bi-whatsapp text-success display-1"></i>
    </div>
    <h4 class="fw-bold mb-3">CONVITE EXCLUSIVO</h4>
    <p class="text-muted mb-4">Clique no botão abaixo para enviar o link de cadastro oficial ao eleitor via WhatsApp.</p>
    
    <div class="bg-light p-3 rounded-4 mb-4 text-start border-start border-5 border-warning">
        <p class="mb-0" style="font-style: italic; font-size: 0.9rem;">
            "{{ mensagem_inspiradora }}"
        </p>
    </div>

    <a href="https://api.whatsapp.com/send?text={{ mensagem_inspiradora|urlencode }}" 
       target="_blank" 
       class="btn btn-success w-100 py-3 rounded-pill fw-bold shadow">
        <i class="bi bi-whatsapp me-2"></i> ENVIAR PELO WHATSAPP
    </a>

    <a href="/dashboard" class="btn btn-link text-muted mt-3">Voltar ao Início</a>
</div>
{% endblock %}
