<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Liderança - Júnior Araújo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --ouro: #D4AF37; --azul: #0A192F; }
        body { background: var(--azul); color: white; font-family: 'Segoe UI', sans-serif; }
        .card-registro { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); }
        .form-control, .form-select { border-radius: 12px; border: none; padding: 12px; }
        .btn-ouro { background: linear-gradient(45deg, #B8860B, #D4AF37); border: none; border-radius: 12px; color: white; font-weight: bold; }
    </style>
</head>
<body>
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card-registro p-4 w-100" style="max-width: 500px;">
        <div class="text-center mb-4">
            <i class="bi bi-person-badge-fill text-warning display-4"></i>
            <h3 class="fw-bold mt-2">NOVO CADASTRO</h3>
            <p class="small text-white-50">Preencha os dados para acessar o painel de Liderança</p>
        </div>
        
        <form action="/registrar_externo/{{ pai_id }}" method="POST">
            <div class="mb-3">
                <label class="small fw-bold">NOME COMPLETO</label>
                <input type="text" name="nome" class="form-control" placeholder="Seu nome" required>
            </div>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="small fw-bold">USUÁRIO (LOGIN)</label>
                    <input type="text" name="login" class="form-control" placeholder="Ex: joao21" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="small fw-bold">SENHA</label>
                    <input type="password" name="senha" class="form-control" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="small fw-bold">SEU MUNICÍPIO</label>
                <select name="municipio" class="form-select" required>
                    {% for m in municipios %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-ouro w-100 py-3">CRIAR MEU ACESSO</button>
        </form>
    </div>
</div>
</body>
</html>
