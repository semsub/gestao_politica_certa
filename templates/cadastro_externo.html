<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Apoiador - JÚNIOR ARAÚJO SISTEMAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --ouro: #D4AF37; --azul: #0A192F; }
        body { background: var(--azul); color: white; font-family: 'Segoe UI', sans-serif; }
        .card-luxo { background: #0A192F; border: 1px solid var(--ouro); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-control, .form-select { border-radius: 5px; border: none; padding: 10px; font-weight: 500; }
        .btn-ouro { background-color: var(--ouro); border: none; border-radius: 10px; color: #000; font-weight: bold; transition: 0.3s; }
        .btn-ouro:hover { background-color: #B8860B; transform: translateY(-2px); }
        .gold-text { color: var(--ouro) !important; }
        label { font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 5px; color: rgba(255,255,255,0.7); }
    </style>
</head>
<body class="py-4">
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card-luxo p-4 w-100" style="max-width: 600px;">
        
        <div class="text-center mb-4">
            <h3 class="fw-bold gold-text text-uppercase mb-1">CADASTRO DE APOIADOR</h3>
            <p class="small text-white-50">Liderança Responsável: <strong class="gold-text text-uppercase">{{ lider_nome if lider_nome else 'PROJETO PRINCIPAL' }}</strong></p>
        </div>

        <form action="{{ url_for('registrar_apoiador_externo', lider_id=pai_id) }}" method="POST">
            <div class="row g-3">
                <div class="col-12">
                    <label class="fw-bold">NOME COMPLETO</label>
                    <input type="text" name="nome_completo" class="form-control" placeholder="Seu nome completo" required>
                </div>

                <div class="col-md-6 col-12">
                    <label class="fw-bold">TÍTULO ELEITORAL</label>
                    <input type="text" name="titulo_eleitoral" class="form-control" placeholder="Nº do Título" required>
                </div>

                <div class="col-md-3 col-6">
                    <label class="fw-bold">ZONA</label>
                    <input type="text" name="zona" class="form-control" placeholder="Zona" required>
                </div>

                <div class="col-md-3 col-6">
                    <label class="fw-bold">SEÇÃO</label>
                    <input type="text" name="secao" class="form-control" placeholder="Seção" required>
                </div>

                <div class="col-12">
                    <label class="fw-bold">RUA / ENDEREÇO</label>
                    <input type="text" name="rua" class="form-control" placeholder="Logradouro">
                </div>

                <div class="col-md-4 col-12">
                    <label class="fw-bold">NÚMERO</label>
                    <input type="text" name="numero" class="form-control" placeholder="Nº">
                </div>

                <div class="col-md-8 col-12">
                    <label class="fw-bold">BAIRRO</label>
                    <input type="text" name="bairro" class="form-control" placeholder="Seu bairro" required>
                </div>

                <div class="col-12">
                    <label class="fw-bold">MUNICÍPIO</label>
                    <select name="municipio" class="form-select" required>
                        <option value="" selected disabled>Selecione o Município</option>
                        {% for m in municipios %}
                        <option value="{{ m }}">{{ m }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-ouro w-100 py-3 text-uppercase">
                    CONFIRMAR MEU APOIO
                </button>
            </div>
            
            <div class="text-center mt-4">
                <p style="font-size: 0.65rem; color: rgba(255,255,255,0.4);">
                    © 2026 JÚNIOR ARAÚJO SISTEMAS<br>
                    GESTÃO POLÍTICA CERTA
                </p>
            </div>
        </form>
    </div>
</div>
</body>
</html>
