{% extends 'base.html' %}
{% block content %}
<div class="card-luxo p-4 animate__animated animate__fadeIn">
    <div class="text-center mb-4">
        <i class="bi bi-people-fill gold-text display-5"></i>
        <h3 class="fw-bold">CADASTRAR ELEITOR</h3>
        <p class="text-muted small">Dados para mapeamento eleitoral</p>
    </div>

    <form action="/eleitor/novo" method="POST">
        <div class="mb-3">
            <label class="fw-bold small">NOME COMPLETO DO ELEITOR</label>
            <input type="text" name="nome_completo" class="form-control rounded-4 shadow-sm" required>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="fw-bold small">TÍTULO</label>
                <input type="text" name="titulo_eleitoral" class="form-control rounded-4 shadow-sm">
            </div>
            <div class="col-6 col-md-4 mb-3">
                <label class="fw-bold small">ZONA</label>
                <input type="text" name="zona" class="form-control rounded-4 shadow-sm">
            </div>
            <div class="col-6 col-md-4 mb-3">
                <label class="fw-bold small">SEÇÃO</label>
                <input type="text" name="secao" class="form-control rounded-4 shadow-sm">
            </div>
        </div>

        <div class="mb-4">
            <label class="fw-bold small">MUNICÍPIO ONDE VOTA</label>
            <select name="municipio" class="form-select rounded-4 shadow-sm">
                {% for m in municipios %}
                <option value="{{ m }}" {% if user.municipio == m %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-ouro w-100 py-3 fw-bold rounded-4">
            <i class="bi bi-save2 me-2"></i> SALVAR ELEITOR
        </button>
    </form>
</div>
{% endblock %}
