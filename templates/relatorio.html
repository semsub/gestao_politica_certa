{% extends "base.html" %}
{% block content %}
<h2>Relatório Geral</h2>

<table>
    <thead>
        <tr>
            <th>Tipo</th>
            <th>Nome</th>
            <th>Município</th>
            <th>Status</th>
            <th>Data</th>
        </tr>
    </thead>
    <tbody>
        {% for item in relatorio %}
        <tr>
            <td>{{ item.tipo }}</td>
            <td>{{ item.nome }}</td>
            <td>{{ item.municipio }}</td>
            <td>{{ item.status }}</td>
            <td>{{ item.data }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
